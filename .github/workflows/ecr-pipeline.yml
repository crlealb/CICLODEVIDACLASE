name: Pipeline Optimizado ECR

on:
  push:
    branches: [ "develop", "main" ] # Adaptación de Triggers (Punto 1)
  pull_request:
    branches: [ "main" ]

jobs:
  CI-Validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js v20 con Caché
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # Optimización: Implementación A (Punto 5.2)

      - name: Instalar Dependencias
        run: npm ci

      - name: Pruebas Unitarias
        run: npm test

  CI-Docker-ECR:
    # Adaptación de Condicionales (Punto 2)
    # Solo sube a ECR si es un push (no en pull requests)
    if: github.event_name == 'push' 
    needs: CI-Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push con Registry Cache
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: clase1
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Optimización: Implementación B (Punto 5.3)
          # Usamos --cache-from para reutilizar capas existentes en ECR
          docker buildx build \
            --cache-from=type=registry,ref=$ECR_REGISTRY/$ECR_REPOSITORY:latest \
            --cache-to=type=inline \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            --push .
