name: Pipeline Optimizado ECR - Duoc UC

# 1. Adaptación de Triggers (Punto 1 de tu guía)
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # FASE 1: Integración Continua (Validación del Código)
  CI-Validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js v20 con Caché
        # 5.2. Implementación A: Caché de Dependencias
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar Dependencias
        # Usamos install en lugar de ci para mayor flexibilidad en el lab
        run: npm install

      - name: Ejecución de Pruebas
        # Esto ejecutará el script "test" de tu package.json
        run: npm test

  # FASE 2: Contenerización y Registro
  CI-Docker-ECR:
    # 2. Adaptación de Condicionales (Punto 2 de tu guía)
    # Solo se ejecuta si el evento es un push (no en pull_requests)
    if: github.event_name == 'push'
    needs: CI-Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push con Registry Cache
        # 5.3. Implementación B: Caché de Capas Docker
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: clase1
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Usamos buildx para habilitar el caché remoto hacia ECR
          docker buildx build \
            --cache-from=type=registry,ref=$ECR_REGISTRY/$ECR_REPOSITORY:latest \
            --cache-to=type=inline \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            --push .
